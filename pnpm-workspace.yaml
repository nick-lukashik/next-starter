# Install scripts of these are only fallbacks for missing prebuilt binaries.
allowBuilds:
    "@parcel/watcher": false
    "@swc/core": false

# Exact versions on `pnpm add`; Renovate keeps them current (renovate.json).
savePrefix: ""
# Skip releases younger than 3 days (minutes), the same as Renovate's minimumReleaseAge.
minimumReleaseAge: 4320

# The patched minimatch for the shadcn CLI (a dev tool), as in the APIs: the Dependabot alert.
overrides:
    "@ts-morph/common>minimatch": 11.0.3
